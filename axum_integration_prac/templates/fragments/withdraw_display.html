<form class ="form" hx-post = "/withdraw/{{ acc_num }}" hx-swap = "outerHTML"
style = "
    display: flex; 
    flex-direction: column; 
    width: 300px;
    gap: 10px;
  ">
    <div>
      <label for = "amount"> Amount: </label>
      <input type = "text" id = "amount" name = "amount" 
        style = "
          width: 100%;
          padding: 10px;
          margin-bottom: 10px;
          border: 1px solid #ccc;
          border-radius: 4px;
          box-sizing: border-box;
          font-size: 16px;
        ">
    </div>

    <button type = "submit"
      style = "
          width: 100%;
          padding: 10px;
          background-color: #FEC288;
          color: white;
          border: none;
          border-radius: 4px;
          font-size: 16px;
          cursor: pointer;
          transition: background-color 0.3s ease;
      "> 
      Withdraw!
    </button>
  </form>
