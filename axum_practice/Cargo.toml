[package]
name = "axum_practice"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8.7"
httpc-test = "0.1.10"
serde = "1.0.228"
serde_json = "1.0.145"
serde_with = "3"
tower-http = { version = "0.6.8", features = ["fs"] } 
tower-cookies = "0.11.0"
lazy-regex = "3.4.2"
async-trait = "0.1.89"
derive_more = { version = "2.1.0", features = ["from", "display"] } 
strum_macros = "0.27.2"
uuid = {version = "1", features = ["v4","fast-rng",]}

[dev-dependencies]
anyhow = "1"
